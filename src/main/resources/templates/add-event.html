<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Admin - Event Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            min-height:100vh;
            font-family: Arial;
        }

        .navbar{
            background:black;
        }

        .form-card{
            background:white;
            border-radius:10px;
            padding:30px;
        }

        .event-card{
            border-radius:10px;
        }

    </style>

</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container-fluid">

<span class="navbar-brand">
Admin Dashboard
</span>

        <a href="/login"
           class="btn btn-danger">
            Logout
        </a>

    </div>
</nav>


<div class="container mt-5">

    <div class="col-md-6 mx-auto">

        <div class="form-card shadow">

            <h3 class="text-center mb-4">
                Add Event
            </h3>


            <form action="/admin/add-event" method="post">

                <div class="mb-3">
                    <label>Event Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Category</label>
                    <input type="text"
                           name="category"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Venue</label>
                    <input type="text"
                           name="venue"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Date</label>
                    <input type="date"
                           name="date"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Time</label>
                    <input type="time"
                           name="time"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Fee</label>
                    <input type="number"
                           name="fee"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Maximum Seats</label>
                    <input type="number"
                           name="maxSeats"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label>Event Image URL</label>
                    <input type="text"
                           name="imageUrl"
                           class="form-control">
                </div>

                <button class="btn btn-primary w-100">
                    Add Event
                </button>

            </form>

        </div>

    </div>


    <hr class="mt-5">

    <h4 class="text-white ">
        Event-wise Registered Students
    </h4>


    <div th:each="event : ${events}" class="mt-4">

        <div class="card shadow-sm event-card">

            <div class="card-header bg-dark text-white d-flex justify-content-between">

                <strong th:text="${event.name}"></strong>

                <a th:href="@{/admin/delete-event/{id}(id=${event.id})}"
                   class="btn btn-danger btn-sm"
                   onclick="return confirm('Delete this event?')">
                    Delete
                </a>

            </div>


            <div class="card-body">

                <table class="table table-bordered text-center">

                    <thead class="table-light">
                    <tr>
                        <th>Student Email</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="reg : ${event.registrations}">
                        <td th:text="${reg.studentEmail}"></td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(event.registrations)}">
                        <td>No students registered yet</td>
                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

</body>
</html>
