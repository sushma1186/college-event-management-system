<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Events</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            background: rgba(0,0,0,0.8);
        }

        .card {
            border-radius: 15px;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card-img-top {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark">
    <div class="container-fluid">
        <span class="navbar-brand">🎟 My Registered Events</span>

        <div>
            <a th:href="@{/student/events(email=${studentEmail})}"
               class="btn btn-warning me-2">
                Back to Events
            </a>

            <a href="/login" class="btn btn-danger">
                Logout
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5">

    <div class="row">

        <div class="col-md-4 mb-4"
             th:each="reg : ${registrations}">

            <div class="card shadow-lg">

                <img th:src="${reg.event.imageUrl}"
                     class="card-img-top"
                     alt="Event Image">

                <div class="card-body">

                    <h5 class="card-title"
                        th:text="${reg.event.name}">
                    </h5>

                    <p class="card-text">
                        <strong>Venue:</strong>
                        <span th:text="${reg.event.venue}"></span><br>

                        <strong>Date:</strong>
                        <span th:text="${reg.event.date}"></span><br>

                        <strong>Time:</strong>
                        <span th:text="${reg.event.time}"></span><br>

                        <strong>Fee:</strong>
                        ₹ <span th:text="${reg.event.fee}"></span>
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
